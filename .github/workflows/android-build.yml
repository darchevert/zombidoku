name: Android Build (local)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.config.ts'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.ZOMBIDOKU_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build Android AAB (local — no EAS credits)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: eas build --platform android --profile production --local --non-interactive

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombidoku-aab
          path: '*.aab'
          retention-days: 30
